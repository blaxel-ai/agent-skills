name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  onboarder-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.4.0

      - name: Test onboarder evaluator
        run: node --test scripts/onboarder-harness/*.test.mjs

      - name: Verify onboarder prompt package
        run: node scripts/verify-onboarder-prompt.mjs

      - name: Smoke test onboarder skill commands
        run: node scripts/verify-onboarder-skill-commands.mjs
